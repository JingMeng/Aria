// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
//  ext.kotlin_version = '1.3.20'
  ext.kotlin_version = '1.9.22'
  repositories {
    mavenCentral()
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.2.1'
//    classpath 'com.novoda:bintray-release:0.9.1'
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlin_version}"
    //        classpath 'com.jfrog.bintray.gradle:gradle-bintray-plugin:1.7'
    //        classpath 'com.github.dcendents:android-maven-gradle-plugin:1.5'
    // NOTE: Do not place your application dependencies here; they belong
    // in the individual module build.gradle files
  }
}

allprojects {
  repositories {
    mavenCentral()
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
  }

  tasks.withType(Javadoc) {
    options {
      encoding "UTF-8"
      charSet 'UTF-8'
      links "http://docs.oracle.com/javase/7/docs/api"
    }
  }
}

task clean(type: Delete) {
  delete rootProject.buildDir
}

ext {
  versionCode = 390
  versionName = '3.8.16-beta-1'
  userOrg = 'arialyy'
  groupId = 'com.arialyy.aria'
  publishVersion = versionName
//  publishVersion = '1.0.4'  //FTP???
  repoName='maven'
//  repoName='aria'

  desc = 'android ??????'
  website = 'https://github.com/AriaLyy/Aria'
  licences = ['Apache-2.0']

  // mavenCentral
  mavenVersion = '3.8.16'
  mavenCentralGroupId = 'me.laoyuyu.aria'
  mavenCentralUserID = 'laoyuyu'
  mavenCentralUserName = 'laoyuyu'
  mavenCentralEmail = '511455842@qq.com'
  mavenCentralLicences = 'Apache-2.0'
  mavenCentralLicencesURL = 'https://www.apache.org/licenses/LICENSE-2.0'
  mavenCentralConnection = 'scm:git:github.com/AriaLyy/Aria.git'
  mavenCentralDeveloperConnection = 'scm:git:ssh://github.com/AriaLyy/Aria.git'
  mavenCentralTreeURL = 'https://github.com/AriaLyy/KeepassA/tree/master'

  compileSdkVersion = 34
  supportLibVersion = "27.1.1"
  buildToolsVersion = "34.0.0"
  targetSdkVersion = 34
  lifecycleVersion = "1.1.1"
  minSdkVersion = 15

  // ?????ndroidX
  XAppcompatVersion = "1.1.0"
}

subprojects {
  plugins.withId('com.android.library') {
    android {
      namespace = [Aria: 'com.arialyy.aria', PublicComponent: 'com.arialyy.aria.publiccomponent',
          HttpComponent: 'com.arialyy.aria.http', M3U8Component: 'com.arialyy.aria.m3u8',
          FtpComponent: 'com.arialyy.aria.ftp', SFtpComponent: 'com.arialyy.aria.sftp',
          AppFrame: 'com.lyy.frame'][project.name]
      compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
      }
      publishing { singleVariant('release') }
    }
  }
  plugins.withId('org.jetbrains.kotlin.android') {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
      kotlinOptions.jvmTarget = '11'
    }
  }
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}
