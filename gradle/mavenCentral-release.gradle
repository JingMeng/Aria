apply plugin: 'maven-publish'

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

afterEvaluate {
  publishing {
    publications {
      release(MavenPublication) {
        groupId = rootProject.ext.mavenCentralGroupId
        artifactId = project.ext.PUBLISH_ARTIFACT_ID
        version = rootProject.ext.mavenVersion
        if (project.plugins.hasPlugin('com.android.library')) {
          from components.release
        } else {
          from components.java
        }
        pom {
          name = project.ext.PUBLISH_ARTIFACT_ID
          description = rootProject.ext.desc
          url = rootProject.ext.website
          licenses {
            license {
              name = rootProject.ext.mavenCentralLicences
              url = rootProject.ext.mavenCentralLicencesURL
            }
          }
        }
      }
    }
  }
}
